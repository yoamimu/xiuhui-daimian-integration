<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}授权管理{% endblock %} · 绣绘</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
  <script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('admin.licenses') }}">绣绘授权管理</a>
      {% if session.get('admin_authenticated') %}
      <nav aria-label="主导航">
        <a href="{{ url_for('admin.licenses') }}">授权列表</a>
        <a class="button primary" href="{{ url_for('admin.new_license') }}">新建授权</a>
        <form method="post" action="{{ url_for('admin.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="button quiet" type="submit">退出</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="page">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="notice {{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
