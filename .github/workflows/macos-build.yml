name: macOS Build

# 双架构构建矩阵：arm64 (Apple Silicon runner) 与 x86_64 (Intel runner)。
# 每个架构独立产出 dmg。可选：配置 Secrets 后启用 Developer ID 签名 + 公证。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0). Defaults to git short SHA.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14            # Apple Silicon
            brew_prefix: /opt/homebrew
          - arch: x86_64
            runner: macos-15-intel       # Intel（macos-13 已退役）
            brew_prefix: /usr/local

    runs-on: ${{ matrix.runner }}

    env:
      HOME: /Users/runner            # 供 working-directory 的 ${{ env.HOME }} 使用
      MAC_ARCH: ${{ matrix.arch }}
      # 未配置 Secrets 时走 ad-hoc 签名 + 跳过公证；配置后自动启用。
      SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || '' }}
      # 公证：优先 App Store Connect API Key（MACOS_API_KEY*），
      # 兼容旧的 Apple ID + App 专用密码方式。
      NOTARIZE: ${{ ((secrets.MACOS_API_KEY != '' && secrets.MACOS_API_KEY_ID != '' && secrets.MACOS_API_ISSUER != '') || secrets.APPLE_APP_SPECIFIC_PASSWORD != '') && '1' || '0' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      # Production packages must always include activation.  The bundle step
      # fails closed when the HTTPS endpoint secret is absent.
      ENABLE_ACTIVATION: '1'
      ACTIVATION_SERVER_URL: ${{ secrets.ACTIVATION_SERVER_URL }}

    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v4

      - name: Setup workspace layout
        run: |
          mkdir -p "$HOME/xiuhui-build/inkscape-inkstitch-preview/src"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/xiuhui-build/xiuhui-daimian-integration"

      - name: Fetch pinned upstream sources (pre-cloned bundle)
        working-directory: ${{ env.HOME }}/xiuhui-build/inkscape-inkstitch-preview/src
        run: |
          # GitLab rate-limits git clones from GitHub runner IPs (HTTP 403)
          # and the GitHub inkscape repo is NOT a mirror of the GitLab master
          # history, so we fetch a pre-cloned, pinned snapshot (inkscape
          # 7923d92 + inkstitch 0312dac incl. submodules) from our own
          # release assets instead.
          EXPECTED="b4525c08299e4f8b9fedbe38424f60cdd2bf19c96c8fdd30f61fddf012d6d40f"
          for i in 1 2 3; do
            curl -fL --retry 3 -o sources.tar.gz \
              "https://github.com/yoamimu/xiuhui-daimian-integration/releases/download/upstream-sources-r1/xiuhui-upstream-sources.tar.gz" && break
            echo "download attempt $i failed; retrying in 20s..."
            sleep 20
          done
          echo "$EXPECTED  sources.tar.gz" | shasum -a 256 -c -
          tar xzf sources.tar.gz
          rm -f sources.tar.gz
          # 01-apply-patches.sh expects git repos (git apply); create
          # minimal ones over the pristine trees.
          for d in inkscape inkstitch; do
            cd "$d"
            git init -q
            git add -A
            git -c user.email=ci@example.com -c user.name=ci commit -qm "pinned upstream base"
            cd ..
          done
          ls -d inkscape inkstitch

      - name: Select newest Xcode (clang >=16 for C++20 parenthesized aggregate init)
        if: matrix.arch == 'arm64'
        run: |
          ls -d /Applications/Xcode*.app | sort -V | tail -3
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          clang++ --version | head -1

      - name: Bootstrap (Homebrew deps)
        run: bash scripts/macos/00-bootstrap.sh
        working-directory: ${{ env.HOME }}/xiuhui-build/xiuhui-daimian-integration

      # On Intel runners python@3.13 has no bottle and its post-build link can
      # conflict with the runner's preinstalled python; repair and continue.
      - name: Repair python link (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          brew link --overwrite python@3.13 || true
          brew bundle install --file=scripts/macos/Brewfile || true
        working-directory: ${{ env.HOME }}/xiuhui-build/xiuhui-daimian-integration

      - name: Apply patches + overlays
        run: bash scripts/macos/01-apply-patches.sh
        working-directory: ${{ env.HOME }}/xiuhui-build/xiuhui-daimian-integration

      - name: Build Inkscape
        run: bash scripts/macos/02-build-inkscape.sh
        working-directory: ${{ env.HOME }}/xiuhui-build/xiuhui-daimian-integration

      - name: Build Ink/Stitch
        run: bash scripts/macos/03-build-inkstitch.sh
        working-directory: ${{ env.HOME }}/xiuhui-build/xiuhui-daimian-integration

      - name: Import signing certificate (optional)
        if: env.SIGNING_IDENTITY != ''
        run: |
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PWD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Bundle + sign
        run: bash scripts/macos/04-bundle.sh
        working-directory: ${{ env.HOME }}/xiuhui-build/xiuhui-daimian-integration

      - name: Bundle self-contained dylibs
        run: bash scripts/macos/04b-bundle-dylibs.sh
        working-directory: ${{ env.HOME }}/xiuhui-build/xiuhui-daimian-integration

      - name: Prepare notarization API key (optional)
        if: env.NOTARIZE == '1' && env.APPLE_APP_SPECIFIC_PASSWORD == ''
        run: |
          echo "${{ secrets.MACOS_API_KEY }}" | base64 --decode > "$HOME/api-key.p8"
          echo "APPLE_API_KEY_FILE=$HOME/api-key.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=${{ secrets.MACOS_API_KEY_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ secrets.MACOS_API_ISSUER }}" >> "$GITHUB_ENV"

      - name: Make dmg (+ notarize if configured)
        run: bash scripts/macos/05-make-dmg.sh
        working-directory: ${{ env.HOME }}/xiuhui-build/xiuhui-daimian-integration

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: 绣绘-${{ matrix.arch }}
          path: ${{ env.HOME }}/xiuhui-build/inkscape-inkstitch-preview/release/*.dmg
          if-no-files-found: error

      - name: Attach to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.HOME }}/xiuhui-build/inkscape-inkstitch-preview/release/*.dmg
